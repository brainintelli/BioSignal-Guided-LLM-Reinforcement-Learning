<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="396pt" height="176pt" viewBox="0 0 396 176" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Model records and two replay checks</title>
  <desc id="chart-desc">Four batches are linked to model registration and to a frozen parameter snapshot. Policy reloading and replaying archived actions have different coverage.</desc>
  <rect x="0" y="0" width="396.0" height="176" fill="#FFFFFF" stroke="none" stroke-width="0.65" />
  <text x="5" y="13" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="11" fill="#174C73" text-anchor="start">A</text>
  <text x="19" y="13" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="10.6" fill="#172B3C" text-anchor="start">Linking training records to frozen parameters</text>
  <line x1="5" x2="391" y1="19" y2="19" stroke="#C3CBD0" stroke-width="0.7" />
  <text x="6" y="32" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="8.8" fill="#172B3C" text-anchor="start">Training records</text>
  <text x="216" y="32" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="8.8" fill="#172B3C" text-anchor="start">Final checkpoint</text>
  <line x1="132" x2="204" y1="30" y2="30" stroke="#445969" stroke-width="0.85" />
  <polygon points="204,30 200.0,32.0 200.0,28.0" fill="#445969" stroke="none" stroke-width="0.7" />
  <text x="6" y="47" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="8.05" fill="#172B3C" text-anchor="start">registration.json  ·  seed and input group</text>
  <text x="216" y="47" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="8.05" fill="#172B3C" text-anchor="start">adapter/ and critic.pt  ·  model parameters</text>
  <text x="6" y="60" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="8.05" fill="#172B3C" text-anchor="start" data-registered-values="[{&quot;number_id&quot;:&quot;DES-batches&quot;,&quot;display&quot;:&quot;4&quot;,&quot;precision&quot;:0,&quot;transform&quot;:&quot;identity&quot;}]">train-1…4.jsonl  ·  recorded decisions</text>
  <text x="216" y="60" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="8.05" fill="#172B3C" text-anchor="start">optimizers.pt  ·  optimizer and RNG state</text>
  <text x="6" y="73" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="8.05" fill="#172B3C" text-anchor="start">update.json  ·  optimization steps</text>
  <text x="216" y="73" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="8.05" fill="#172B3C" text-anchor="start">policy.json and manifest.json  ·  provenance</text>
  <line x1="5" x2="391" y1="83" y2="83" stroke="#C3CBD0" stroke-width="0.7" />
  <text x="5" y="98" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="11" fill="#174C73" text-anchor="start">B</text>
  <text x="19" y="98" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="10.6" fill="#172B3C" text-anchor="start">What each verification covers</text>
  <text x="6" y="115" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="9.1" fill="#174C73" text-anchor="start">Frozen-policy reload</text>
  <text x="208" y="115" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="9.1" fill="#80521E" text-anchor="start">Replay of stored actions</text>
  <line x1="197" x2="197" y1="104" y2="170" stroke="#C3CBD0" stroke-width="0.7" />
  <text x="6" y="132" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="9" fill="#172B3C" text-anchor="start" data-registered-values="[{&quot;number_id&quot;:&quot;QC-policy-reload-episodes&quot;,&quot;display&quot;:&quot;288&quot;,&quot;precision&quot;:0,&quot;transform&quot;:&quot;identity&quot;},{&quot;number_id&quot;:&quot;QC-policy-reload-decisions&quot;,&quot;display&quot;:&quot;9,351&quot;,&quot;precision&quot;:0,&quot;transform&quot;:&quot;identity&quot;}]">288 games · 9,351 decisions</text>
  <text x="208" y="132" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="bold" font-size="9" fill="#172B3C" text-anchor="start" data-registered-values="[{&quot;number_id&quot;:&quot;QC-native-replay-episodes&quot;,&quot;display&quot;:&quot;18,432&quot;,&quot;precision&quot;:0,&quot;transform&quot;:&quot;identity&quot;},{&quot;number_id&quot;:&quot;QC-native-replay-decisions&quot;,&quot;display&quot;:&quot;669,715&quot;,&quot;precision&quot;:0,&quot;transform&quot;:&quot;identity&quot;}]">18,432 games · 669,715 actions</text>
  <text x="6" y="146" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="7.8" fill="#172B3C" text-anchor="start" data-registered-values="[{&quot;number_id&quot;:&quot;QC-policy-reload-models&quot;,&quot;display&quot;:&quot;96&quot;,&quot;precision&quot;:0,&quot;transform&quot;:&quot;identity&quot;}]">96 models; first map in each scenario.</text>
  <text x="6" y="158" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="7.8" fill="#172B3C" text-anchor="start" data-registered-values="[{&quot;number_id&quot;:&quot;QC-policy-reload-action_mismatches&quot;,&quot;display&quot;:&quot;0&quot;,&quot;precision&quot;:0,&quot;transform&quot;:&quot;identity&quot;}]">Regenerated action mismatches: 0.</text>
  <text x="208" y="146" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="7.8" fill="#172B3C" text-anchor="start">Exploration, survival and restricted waiting</text>
  <text x="208" y="158" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="7.8" fill="#172B3C" text-anchor="start">matched at the cutoff. R1 score exceptions are</text>
  <text x="208" y="169" font-family="Times New Roman, Times New Roman, Times, serif" font-weight="normal" font-size="7.8" fill="#172B3C" text-anchor="start">reported separately in Appendix B.</text>
</svg>