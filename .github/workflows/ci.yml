name: Reproduce the analysis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python original/materialize.py verify
      - run: python scripts/pack_pairs.py "data/upstream/22021_逐局配对实测.csv" runs/rebuilt-pairs.csv
      - run: python -m unittest discover -s tests -v
      - run: python -m src.reproduce smoke
      - run: python -m src.reproduce exploration
      - run: python -m src.reproduce all
